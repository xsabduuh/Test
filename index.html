<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DevPath 180 • Notes Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <style>
    :root {
      --bg: #000000;
      --card: #0a0a0f;
      --border: #1c1c24;
      --text: #f5f5f7;
      --secondary: #8e8e93;
      --accent: #0a84ff;
      --accent2: #409cff;
      --green: #30d158;
      --red: #ff453a;
      --radius: 14px;
      --font: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      --shadow: 0 2px 20px rgba(0,0,0,0.8);
      --note-bg: #12121a;
      --project-bg: #1a1a24;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      display: flex;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    .app {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      max-width: 100vw;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar{width:0; height:0}

    /* ---- HOME VIEW ---- */
    .home-view, .trash-view { display: none; flex-direction: column; flex: 1; padding: 16px 16px 0; overflow-x: hidden; }
    .home-view.active, .trash-view.active { display: flex; }
    .home-header, .trash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 8px; width: 100%; }
    .home-title, .trash-title {
      font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      flex-shrink: 0;
    }
    .home-actions { display: flex; gap: 10px; flex-shrink: 0; }
    .home-new-btn, .home-project-btn {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--card); color: var(--accent); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease;
    }
    .home-new-btn:hover, .home-project-btn:hover { background: #1a1a2e; border-color: var(--accent); transform: scale(1.05); }
    .home-project-btn { color: var(--green); border-color: rgba(48,209,88,0.25); }
    .home-project-btn:hover { border-color: var(--green); background: rgba(48,209,88,0.08); }

    .home-tools { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; width: 100%; }
    .search-input {
      flex: 1 1 auto; min-width: 0; width: auto;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 8px 12px; border-radius: 12px;
      font-size: 0.85rem; outline: none;
    }
    .search-input::placeholder { color: var(--secondary); }
    .filter-chip {
      padding: 6px 12px; border-radius: 16px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--secondary); cursor: pointer; font-size: 0.75rem;
      font-weight: 600; white-space: nowrap; transition: all 0.2s;
      flex-shrink: 0;
    }
    .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .section-title {
      font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--secondary);
      margin-bottom: 8px; padding-left: 4px; width: 100%;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
      width: 100%;
    }
    .note-card-home {
      background: var(--note-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px;
      cursor: pointer; transition: all 0.2s; position: relative;
      min-width: 0;
    }
    .note-card-home:hover { border-color: var(--accent); box-shadow: 0 6px 16px rgba(10,132,255,0.12); }
    .note-card-home:active { background: #1e1e2c; }
    .note-card-home .title { font-weight: 600; font-size: 0.9rem; margin-bottom: 6px; padding-right: 22px; }
    .note-card-home .lang {
      font-size: 0.6rem; text-transform: uppercase;
      color: rgba(10,132,255,0.7);
      background: rgba(10,132,255,0.08);
      padding: 2px 6px; border-radius: 4px;
    }
    .note-card-home .project-badge {
      font-size: 0.6rem; text-transform: uppercase;
      color: rgba(48,209,88,0.7);
      background: rgba(48,209,88,0.08);
      padding: 2px 6px; border-radius: 4px;
    }
    .pin-btn {
      position: absolute; top: 8px; right: 8px;
      background: none; border: none; color: var(--secondary);
      cursor: pointer; padding: 2px; border-radius: 4px;
    }
    .pin-btn.pinned { color: #f59e0b; }
    .delete-btn {
      position: absolute; bottom: 10px; right: 10px;
      background: none; border: none; color: var(--secondary);
      cursor: pointer; font-size: 0.7rem;
    }
    .delete-btn:hover { color: var(--red); }

    .empty-notes { grid-column: 1 / -1; text-align: center; padding: 20px; color: var(--secondary); font-size: 0.8rem; }
    .bottom-links { display: flex; gap: 12px; margin-top: 8px; align-items: center; width: 100%; }
    .dashboard-link, .trash-link {
      display: inline-flex; align-items: center; gap: 4px;
      color: var(--accent); text-decoration: none; font-weight: 500;
      font-size: 0.8rem; cursor: pointer;
    }
    .trash-link { color: var(--secondary); }

    /* ---- EDITOR VIEW ---- */
    .editor-view { display: none; flex-direction: column; flex: 1; max-width: 100vw; overflow-x: hidden; }
    .editor-view.active { display: flex; }
    .navbar {
      padding: 6px 12px; display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--border); min-height: 48px; background: #000;
      width: 100%;
    }
    .back-btn {
      background: none; border: none; color: var(--accent); font-size: 0.85rem;
      cursor: pointer; display: flex; align-items: center; gap: 3px; flex-shrink: 0;
    }
    .nav-title-input {
      flex: 1; background: transparent; border: none; font-size: 1rem;
      font-weight: 600; color: var(--text); outline: none; min-width: 0;
    }
    .nav-title-input::placeholder { color: var(--secondary); }

    /* Tab bar - horizontal scroll without overflow */
    .tabs-bar {
      display: flex; align-items: stretch;
      background: #000; border-bottom: 1px solid #1c1c24;
      width: 100%; overflow-x: auto; overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      padding: 0 4px;
      min-height: 38px;
      white-space: nowrap;
    }
    .tabs-bar::-webkit-scrollbar { display: none; }
    .tab {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 0 12px; height: 38px; font-size: 0.75rem; font-weight: 500;
      color: var(--secondary); background: transparent;
      border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: all 0.15s; flex-shrink: 0;
    }
    .tab:hover { color: #d0d0e0; background: rgba(255,255,255,0.03); }
    .tab.active { color: #fff; background: #1a1a2e; border-bottom-color: var(--accent); font-weight: 600; }
    .file-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; flex-shrink: 0; }
    .file-dot.html { background: #e44d26; }
    .file-dot.css { background: #264de4; }
    .file-dot.js, .file-dot.jsx, .file-dot.ts { background: #f7df1e; }
    .file-dot.py { background: #306998; }
    .file-dot.json { background: #f5a623; }
    .tab-close {
      width: 16px; height: 16px; border-radius: 3px;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.9rem; color: inherit; opacity: 0;
      transition: opacity 0.15s; line-height: 1; flex-shrink: 0;
    }
    .tab:hover .tab-close { opacity: 0.6; }
    .add-file-btn {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 0 12px; height: 38px; background: transparent; border: none;
      color: var(--secondary); font-size: 0.75rem; font-weight: 500;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
      position: sticky; right: 0; background: #000;
    }
    .add-file-btn:hover { color: #fff; }

    /* Editor area */
    .editor-container { flex: 1; display: flex; flex-direction: column; min-height: 0; width: 100%; }
    .code-stage { flex: 1; position: relative; overflow: hidden; width: 100%; }
    .code-layer {
      position: absolute; inset: 8px 8px 8px 46px;
      font-family: var(--mono); font-size: 0.82rem;
      line-height: 1.7; white-space: pre-wrap;
      overflow: auto; border: none; outline: none; background: transparent;
    }
    .code-textarea { color: transparent; caret-color: var(--accent); resize: none; z-index: 2; }
    .code-textarea::selection { background: rgba(10,132,255,0.35); }
    .code-preview { pointer-events: none; z-index: 1; }
    .code-preview code { background: transparent !important; padding: 0 !important; }
    .line-numbers {
      position: absolute; top: 8px; left: 2px; bottom: 8px;
      width: 38px; font-family: var(--mono); font-size: 0.72rem;
      color: var(--secondary); text-align: right;
      overflow: hidden; z-index: 3; pointer-events: none;
      line-height: 1.7; padding-right: 4px;
    }
    .line-numbers span { display: block; }
    .preview-pane { display: none; position: absolute; inset: 0; background: #fff; z-index: 10; }
    .preview-pane.visible { display: flex; }
    .preview-pane iframe { width: 100%; height: 100%; border: none; }

    /* Bottom toolbar - must fit screen */
    .bottom-toolbar {
      display: flex; align-items: center; gap: 4px;
      padding: 6px 8px; border-top: 1px solid var(--border);
      background: #000; flex-wrap: wrap;
      width: 100%; overflow-x: hidden;
    }
    .lang-picker {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 6px 10px; border-radius: 16px;
      font-size: 0.7rem; outline: none; cursor: pointer; max-width: 90px;
      flex-shrink: 0;
    }
    .tool-btn {
      padding: 6px 10px; border-radius: 16px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 0.7rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 3px;
      transition: all 0.15s; white-space: nowrap; flex-shrink: 0;
    }
    .tool-btn:active { transform: scale(0.95); }
    .tool-btn.copy { color: var(--green); border-color: rgba(48,209,88,0.3); }
    .tool-btn.save { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tool-btn.delete { color: var(--red); border-color: rgba(255,69,58,0.3); }
    .tool-btn svg { width: 14px; height: 14px; }
    .status-bar {
      padding: 2px 12px; display: flex; justify-content: space-between;
      font-size: 0.65rem; color: var(--secondary); font-family: var(--mono);
      background: #000; width: 100%;
    }

    .toast-panel {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      z-index: 200; display: flex; flex-direction: column; gap: 4px; pointer-events: none;
    }
    .toast {
      background: var(--card); border: 1px solid var(--border);
      padding: 8px 18px; border-radius: 16px;
      font-weight: 500; font-size: 0.8rem;
      box-shadow: var(--shadow); text-align: center;
      animation: toastIn 0.4s ease; pointer-events: auto;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 480px) {
      .notes-grid { grid-template-columns: 1fr; }
      .tool-btn { padding: 5px 8px; font-size: 0.65rem; gap: 2px; }
      .lang-picker { font-size: 0.65rem; padding: 5px 8px; }
    }
  </style>
</head>
<body>
<div class="app" id="appRoot">

  <!-- HOME -->
  <div class="home-view active" id="homeView">
    <div class="home-header">
      <span class="home-title">DevPath Notes</span>
      <div class="home-actions">
        <button class="home-new-btn" id="homeNewBtn" title="New note">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
        </button>
        <button class="home-project-btn" id="homeProjectBtn" title="New project">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
        </button>
      </div>
    </div>
    <div class="home-tools">
      <input type="text" class="search-input" id="homeSearch" placeholder="Search notes..." autocomplete="off">
      <button class="filter-chip active" data-lang="all">All</button>
      <button class="filter-chip" data-lang="html">HTML</button>
      <button class="filter-chip" data-lang="css">CSS</button>
      <button class="filter-chip" data-lang="javascript">JS</button>
      <button class="filter-chip" data-lang="python">Python</button>
    </div>
    <div class="section-title">Notes</div>
    <div class="notes-grid" id="notesGrid"></div>
    <div class="section-title">Projects</div>
    <div class="notes-grid" id="projectsGrid"></div>
    <div class="bottom-links">
      <a href="./index.html" class="dashboard-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Dashboard
      </a>
      <span class="trash-link" id="trashLink">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        Trash
      </span>
    </div>
  </div>

  <!-- TRASH -->
  <div class="trash-view" id="trashView">
    <div class="trash-header">
      <span class="trash-title">Trash</span>
      <button class="back-btn" id="trashBackBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
    </div>
    <div class="notes-grid" id="trashGrid"></div>
    <div class="empty-notes" id="trashEmpty" style="display:none;">Trash is empty.</div>
  </div>

  <!-- EDITOR -->
  <div class="editor-view" id="editorView">
    <div class="navbar">
      <button class="back-btn" id="editorBackBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <input type="text" class="nav-title-input" id="noteTitle" placeholder="Note title">
    </div>
    <div class="tabs-bar" id="tabsBar" style="display:none;">
      <span id="tabsContainer" style="display:flex; align-items:stretch; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;"></span>
      <button class="add-file-btn" id="addFileBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add file
      </button>
    </div>
    <div class="editor-container">
      <div class="code-stage" id="codeStage">
        <div class="line-numbers" id="lineNums">1</div>
        <textarea class="code-layer code-textarea" id="codeTextarea" placeholder="Write code…" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        <pre class="code-layer code-preview"><code class="hljs" id="codeHighlight"></code></pre>
        <div class="preview-pane" id="previewPane">
          <iframe id="previewIframe" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>
    </div>
    <div class="bottom-toolbar">
      <select class="lang-picker" id="langPicker">
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JS</option>
        <option value="python">Python</option>
        <option value="plaintext">Text</option>
      </select>
      <button class="tool-btn copy" id="copyBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copy
      </button>
      <button class="tool-btn select-all" id="selectAllBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Sel
      </button>
      <button class="tool-btn undo" id="undoBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15.05a9 9 0 102.83-9.11L1 10"/></svg>
      </button>
      <button class="tool-btn redo" id="redoBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15.05a9 9 0 11-2.83-9.11L23 10"/></svg>
      </button>
      <button class="tool-btn preview" id="previewBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="tool-btn delete" id="deleteBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
      <button class="tool-btn save" id="saveBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/></svg>
        Save
      </button>
    </div>
    <div class="status-bar">
      <span id="lineCount">Ln 1</span>
      <span id="charCount">0 chars</span>
    </div>
  </div>
</div>

<div class="toast-panel" id="toastPanel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function() {
  const STORAGE_KEY = 'devpath_notes';
  const TRASH_KEY = 'devpath_trash';
  let notes = [], trash = [];
  let currentId = null, originalNote = null;
  let currentFiles = null, activeFileName = 'index.html', isMultiFile = false;
  let undoStack = [], redoStack = [], currentSnapshot = '', isUndoRedo = false;
  let previewVisible = false, updatePreviewTimer;
  let filterLang = 'all', searchTerm = '';

  const $ = id => document.getElementById(id);
  const homeView = $('homeView'), trashView = $('trashView'), editorView = $('editorView');
  const previewPane = $('previewPane'), previewIframe = $('previewIframe');
  const codeTextarea = $('codeTextarea'), codeHighlight = $('codeHighlight'), lineNums = $('lineNums');
  const notesGrid = $('notesGrid'), projectsGrid = $('projectsGrid'), trashGrid = $('trashGrid'), trashEmpty = $('trashEmpty');
  const tabsBar = $('tabsBar'), tabsContainer = $('tabsContainer');

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    $('toastPanel').appendChild(t); setTimeout(() => t.remove(), 2500);
  }

  function loadNotes() { try { notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch(e) { notes = []; } }
  function saveNotes() { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }
  function loadTrash() { try { trash = JSON.parse(localStorage.getItem(TRASH_KEY)) || []; } catch(e) { trash = []; } }
  function saveTrash() { localStorage.setItem(TRASH_KEY, JSON.stringify(trash)); }
  function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,9); }

  function renderHome() {
    const noteList = notes.filter(n => !n.files), projectList = notes.filter(n => !!n.files);
    const apply = list => {
      let f = [...list];
      if (filterLang !== 'all') f = f.filter(n => n.lang === filterLang);
      if (searchTerm.trim()) f = f.filter(n => (n.title||'').toLowerCase().includes(searchTerm.toLowerCase()));
      f.sort((a,b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updated - a.updated);
      return f;
    };
    renderGrid(notesGrid, apply(noteList), false);
    renderGrid(projectsGrid, apply(projectList), true);
  }

  function renderGrid(grid, items, isProject) {
    if (!items.length) { grid.innerHTML = `<div class="empty-notes">No ${isProject?'projects':'notes'} yet.</div>`; return; }
    grid.innerHTML = items.map(n => {
      const pinClass = n.pinned ? 'pinned' : '';
      const lang = isProject ? '<span class="project-badge">Project</span>' : `<span class="lang">${n.lang||'txt'}</span>`;
      return `<div class="note-card-home" data-id="${n.id}">
        <button class="pin-btn ${pinClass}" data-pin="${n.id}"><svg width="14" height="14" viewBox="0 0 24 24" fill="${n.pinned?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l3 9h6l-3 9v4H6v-4l-3-9h6z"/></svg></button>
        <div class="title">${esc(n.title||'Untitled')}</div>${lang}
        <button class="delete-btn" data-del="${n.id}">Delete</button></div>`;
    }).join('');
    grid.querySelectorAll('.note-card-home').forEach(c => c.addEventListener('click', e => {
      if (!e.target.closest('[data-del]') && !e.target.closest('[data-pin]')) openNote(c.dataset.id);
    }));
    grid.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); moveToTrash(b.dataset.del); }));
    grid.querySelectorAll('[data-pin]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); togglePin(b.dataset.pin); }));
  }

  function togglePin(id) { const n = notes.find(n=>n.id===id); if(n){ n.pinned=!n.pinned; n.updated=Date.now(); saveNotes(); renderHome(); toast(n.pinned?'Pinned':'Unpinned'); } }
  function moveToTrash(id) {
    const note = notes.find(n=>n.id===id); if(!note) return;
    if (currentId === id) discardAndClose();
    trash.push({ id: generateId(), note: {...note}, deletedAt: Date.now() });
    notes = notes.filter(n=>n.id!==id); saveNotes(); saveTrash(); renderHome(); toast('Moved to trash');
  }

  function renderTrash() {
    if (!trash.length) { trashGrid.innerHTML = ''; trashEmpty.style.display = 'block'; return; }
    trashEmpty.style.display = 'none';
    trashGrid.innerHTML = trash.map(t => `
      <div class="note-card-home" style="opacity:0.85"><div class="title">${esc(t.note.title||'Untitled')}</div>
        <div style="font-size:0.65rem;color:var(--secondary)">Deleted ${timeAgo(t.deletedAt)}</div>
        <button class="delete-btn" style="position:static" data-restore="${t.id}">Restore</button>
        <button class="delete-btn" style="position:static;color:var(--red)" data-permadelete="${t.id}">Del forever</button></div>`).join('');
    trashGrid.querySelectorAll('[data-restore]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); restore(b.dataset.restore); }));
    trashGrid.querySelectorAll('[data-permadelete]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); permDelete(b.dataset.perma); }));
  }
  function restore(id) { const i = trash.findIndex(t=>t.id===id); if(i===-1)return; notes.unshift({...trash[i].note}); trash.splice(i,1); saveNotes(); saveTrash(); renderTrash(); renderHome(); toast('Restored'); }
  function permDelete(id) { if(!confirm('Delete permanently?'))return; trash = trash.filter(t=>t.id!==id); saveTrash(); renderTrash(); toast('Deleted'); }
  function timeAgo(ts) { const s = Math.floor((Date.now()-ts)/1000); if(s<60)return'just now'; const m=Math.floor(s/60); if(m<60)return`${m}m ago`; const h=Math.floor(m/60); if(h<24)return`${h}h ago`; return`${Math.floor(h/24)}d ago`; }

  function openNote(id) {
    if (previewVisible) togglePreview();
    const note = notes.find(n=>n.id===id); if(!note) return;
    currentId = id; originalNote = JSON.parse(JSON.stringify(note));
    $('noteTitle').value = note.title || '';
    isMultiFile = !!note.files;
    if (isMultiFile) { currentFiles = {...note.files}; activeFileName = Object.keys(currentFiles)[0]||'index.html'; tabsBar.style.display='flex'; renderTabs(); }
    else { currentFiles = null; tabsBar.style.display='none'; codeTextarea.value = note.content||''; $('langPicker').value = note.lang||'plaintext'; }
    homeView.classList.remove('active'); editorView.classList.add('active');
    updateEditorContent(); refreshHighlight(); updateStats(); resetUndoRedo();
  }

  function createNew(isProject) {
    const n = { id: generateId(), title: '', updated: Date.now(), lang: 'html', pinned: false };
    if (isProject) n.files = { 'index.html': '', 'style.css': '', 'script.js': '' }; else n.content = '';
    notes.unshift(n); openNote(n.id); renderHome();
  }
  function updateEditorContent() { if (isMultiFile && currentFiles && activeFileName) { codeTextarea.value = currentFiles[activeFileName]||''; $('langPicker').value = getLang(activeFileName); } }
  function getLang(name) { const e = name.split('.').pop().toLowerCase(); return {html:'html',css:'css',js:'javascript',py:'python',sql:'sql',json:'json',sh:'bash'}[e]||'plaintext'; }
  function getDot(name) { const e = name.split('.').pop().toLowerCase(); return {html:'html',css:'css',js:'js',py:'py',json:'json'}[e]||'txt'; }

  function renderTabs() {
    if (!isMultiFile || !currentFiles) return;
    tabsContainer.innerHTML = Object.keys(currentFiles).map(name => {
      return `<div class="tab ${name===activeFileName?'active':''}" data-file="${name}">
        <span class="file-dot ${getDot(name)}"></span><span>${name}</span><span class="tab-close" data-close="${name}">&times;</span></div>`;
    }).join('');
    tabsContainer.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = function(e) {
        if (e.target.closest('.tab-close')) {
          e.stopPropagation(); const fname = e.target.dataset.close;
          if (confirm(`Delete ${fname}?`)) { delete currentFiles[fname]; if (activeFileName===fname) activeFileName=Object.keys(currentFiles)[0]||'index.html'; renderTabs(); updateEditorContent(); refreshHighlight(); updateStats(); }
        } else { activeFileName = tab.dataset.file; renderTabs(); updateEditorContent(); refreshHighlight(); updateStats(); resetUndoRedo(); }
      };
      tab.ondblclick = function(e) {
        if (e.target.closest('.tab-close')) return;
        const old = tab.dataset.file, nw = prompt('Rename:', old);
        if (!nw || nw===old) return; if (currentFiles[nw]) { toast('Exists'); return; }
        currentFiles[nw] = currentFiles[old]; delete currentFiles[old];
        if (activeFileName===old) activeFileName=nw;
        renderTabs(); updateEditorContent(); refreshHighlight(); updateStats();
      };
    });
  }

  function buildNote() { const i = notes.findIndex(n=>n.id===currentId); if(i===-1)return null; const n={...notes[i]}; n.title=$('noteTitle').value.trim(); n.updated=Date.now(); if(isMultiFile){n.files={...currentFiles};delete n.content;}else{n.content=codeTextarea.value;n.lang=$('langPicker').value;} return n; }
  function saveCurrent() { if(!currentId)return; const u=buildNote(); if(!u)return; const i=notes.findIndex(n=>n.id===currentId); if(i!==-1)notes[i]=u; saveNotes(); originalNote=JSON.parse(JSON.stringify(u)); toast('Saved'); renderHome(); }
  function discardAndClose() {
    if (!currentId) return; const i = notes.findIndex(n=>n.id===currentId);
    const isNew = originalNote && !originalNote.title && (!originalNote.files ? !originalNote.content : Object.values(originalNote.files).every(v=>!v));
    if (isNew && i!==-1) notes.splice(i,1); else if (originalNote && i!==-1) { notes[i]={...originalNote}; saveNotes(); }
    currentId=null; originalNote=null; isMultiFile=false; currentFiles=null;
    editorView.classList.remove('active'); homeView.classList.add('active');
    $('noteTitle').value=''; codeTextarea.value=''; codeHighlight.textContent='';
    resetUndoRedo(); if(previewVisible)togglePreview(); tabsBar.style.display='none'; renderHome();
  }
  function closeEditor() { discardAndClose(); }
  function deleteCurrent() { if(!currentId)return; if(!confirm('Delete?'))return; moveToTrash(currentId); currentId=null; editorView.classList.remove('active'); homeView.classList.add('active'); resetUndoRedo(); tabsBar.style.display='none'; }

  function togglePreview() {
    previewVisible=!previewVisible;
    if(previewVisible){ codeTextarea.style.display='none'; codeHighlight.parentElement.style.display='none'; lineNums.style.display='none'; previewPane.classList.add('visible'); updatePreview(); }
    else { codeTextarea.style.display=''; codeHighlight.parentElement.style.display=''; lineNums.style.display=''; previewPane.classList.remove('visible'); }
  }
  function updatePreview() { clearTimeout(updatePreviewTimer); updatePreviewTimer=setTimeout(()=>{ if(!previewVisible)return; let c=''; if(isMultiFile&&currentFiles){ const h=currentFiles['index.html']||''; const css=Object.keys(currentFiles).filter(f=>f.endsWith('.css')).map(f=>currentFiles[f]).join('\n'); const js=Object.keys(currentFiles).filter(f=>f.endsWith('.js')).map(f=>currentFiles[f]).join('\n'); c=h.replace('</head>',`<style>${css}</style></head>`).replace('</body>',`<script>${js}<\/script></body>`); }else{c=codeTextarea.value;} previewIframe.srcdoc=c; },80); }

  function resetUndoRedo() { undoStack=[]; redoStack=[]; currentSnapshot=codeTextarea.value; updateUndoBtns(); }
  function updateUndoBtns() { $('undoBtn').disabled=undoStack.length===0; $('redoBtn').disabled=redoStack.length===0; }
  function pushUndo() { const v=codeTextarea.value; if(v!==currentSnapshot&&!isUndoRedo){undoStack.push(currentSnapshot);currentSnapshot=v;redoStack=[];updateUndoBtns();} }
  function performUndo() { if(!undoStack.length)return; isUndoRedo=true; const p=undoStack.pop(); redoStack.push(currentSnapshot); codeTextarea.value=p; currentSnapshot=p; refreshHighlight();updateStats();if(previewVisible)updatePreview(); if(isMultiFile&&activeFileName)currentFiles[activeFileName]=p; updateUndoBtns(); isUndoRedo=false; }
  function performRedo() { if(!redoStack.length)return; isUndoRedo=true; const n=redoStack.pop(); undoStack.push(currentSnapshot); codeTextarea.value=n; currentSnapshot=n; refreshHighlight();updateStats();if(previewVisible)updatePreview(); if(isMultiFile&&activeFileName)currentFiles[activeFileName]=n; updateUndoBtns(); isUndoRedo=false; }

  function refreshHighlight() { const code=codeTextarea.value, lang=$('langPicker').value; let out; try{out=lang==='plaintext'?esc(code):hljs.highlight(code,{language:lang,ignoreIllegals:true}).value;}catch(e){out=esc(code);} codeHighlight.innerHTML=out;syncScroll();drawLineNumbers(); }
  function syncScroll(){ const pre=codeHighlight.parentElement; pre.scrollTop=codeTextarea.scrollTop; pre.scrollLeft=codeTextarea.scrollLeft; }
  function drawLineNumbers(){ const lines=codeTextarea.value.split('\n'); lineNums.innerHTML=lines.map((_,i)=>`<span>${i+1}</span>`).join(''); lineNums.scrollTop=codeTextarea.scrollTop; }
  async function copyCode(){ const code=codeTextarea.value; if(!code.trim()){toast('Nothing to copy');return;} try{await navigator.clipboard.writeText(code); const btn=$('copyBtn'); btn.classList.add('copied'); btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!'; setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy';},2000);toast('Copied');}catch(e){toast('Copy failed');}}
  function selectAllCode(){ codeTextarea.focus(); codeTextarea.select(); toast('All selected'); }
  function updateStats(){ const code=codeTextarea.value; $('charCount').textContent=code.length+' chars'; $('lineCount').textContent='Ln '+code.split('\n').length; }
  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  loadNotes(); loadTrash(); renderHome();

  $('homeNewBtn').addEventListener('click', ()=>createNew(false));
  $('homeProjectBtn').addEventListener('click', ()=>createNew(true));
  $('editorBackBtn').addEventListener('click', closeEditor);
  $('saveBtn').addEventListener('click', saveCurrent);
  $('deleteBtn').addEventListener('click', deleteCurrent);
  $('copyBtn').addEventListener('click', copyCode);
  $('selectAllBtn').addEventListener('click', selectAllCode);
  $('undoBtn').addEventListener('click', performUndo);
  $('redoBtn').addEventListener('click', performRedo);
  $('previewBtn').addEventListener('click', togglePreview);
  $('homeSearch').addEventListener('input', e => { searchTerm = e.target.value; renderHome(); });
  document.querySelectorAll('.filter-chip').forEach(c => c.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active'); filterLang = c.dataset.lang; renderHome();
  }));
  $('langPicker').addEventListener('change', () => refreshHighlight());
  codeTextarea.addEventListener('input', () => { refreshHighlight(); updateStats(); pushUndo(); if(isMultiFile&&activeFileName)currentFiles[activeFileName]=codeTextarea.value; if(previewVisible)updatePreview(); });
  codeTextarea.addEventListener('scroll', () => { syncScroll(); drawLineNumbers(); });
  codeTextarea.addEventListener('keydown', e => {
    if(e.key==='Tab'){ e.preventDefault(); const s=codeTextarea.selectionStart; codeTextarea.value=codeTextarea.value.substring(0,s)+'  '+codeTextarea.value.substring(codeTextarea.selectionEnd); codeTextarea.selectionStart=codeTextarea.selectionEnd=s+2; refreshHighlight();updateStats();pushUndo(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='z'){ e.preventDefault(); performUndo(); }
    if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='Z'&&e.shiftKey))){ e.preventDefault(); performRedo(); }
  });
  document.addEventListener('keydown', e => {
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); saveCurrent(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='n'){ e.preventDefault(); createNew(false); }
  });
  $('addFileBtn').addEventListener('click', () => {
    let name = prompt('File name (e.g., main.js):'); if(!name)return;
    if(!/\.\w+$/.test(name)) name+='.html';
    if(currentFiles && currentFiles[name]) return toast('File exists');
    if(currentFiles) currentFiles[name]='';
    activeFileName=name; renderTabs(); updateEditorContent(); refreshHighlight(); updateStats(); resetUndoRedo();
  });
  $('trashLink').addEventListener('click', () => { homeView.classList.remove('active'); trashView.classList.add('active'); renderTrash(); });
  $('trashBackBtn').addEventListener('click', () => { trashView.classList.remove('active'); homeView.classList.add('active'); renderHome(); });
})();
</script>
</body>
</html>
