<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عجلة الاختيار العشوائي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #e2e8f0;
        }

        .container {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(15px);
            border-radius: 24px;
            padding: 30px 25px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            color: #a5b4fc;
            letter-spacing: 1px;
        }

        .input-section {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #choiceInput {
            flex: 1 1 200px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #4f46e5;
            background: #1e293b;
            color: #f1f5f9;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        #choiceInput:focus {
            border-color: #818cf8;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            background: #4f46e5;
            color: white;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        button:hover {
            background: #6366f1;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: #4b5563;
        }

        #clearBtn {
            background: #b91c1c;
        }

        #clearBtn:hover {
            background: #dc2626;
        }

        .choices-list {
            list-style: none;
            margin: 15px 0;
            max-height: 180px;
            overflow-y: auto;
            padding: 0;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .choice-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            border-bottom: 1px solid #1e293b;
            color: #cbd5e1;
            transition: background 0.2s;
        }

        .choice-item:last-child {
            border-bottom: none;
        }

        .choice-item:hover {
            background: #1e293b;
        }

        .choice-text {
            flex: 1;
            text-align: right;
            margin-left: 10px;
            word-break: break-word;
        }

        .delete-btn {
            background: transparent;
            color: #f87171;
            border: 1px solid #f87171;
            padding: 5px 12px;
            font-size: 0.8rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .delete-btn:hover {
            background: #f87171;
            color: white;
        }

        .wheel-container {
            position: relative;
            margin: 25px auto 15px;
            width: 320px;
            height: 320px;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            background: transparent;
        }

        #spinBtn {
            font-size: 1.2rem;
            padding: 12px 30px;
            background: #f59e0b;
            color: #0f172a;
            margin: 10px 0;
            width: 80%;
            max-width: 300px;
        }

        #spinBtn:hover:not(:disabled) {
            background: #fbbf24;
        }

        #result {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            min-height: 35px;
            color: #facc15;
            padding: 8px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
        }

        .empty-message {
            padding: 20px;
            color: #64748b;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎡 عجلة الحظ</h1>

        <div class="input-section">
            <input type="text" id="choiceInput" placeholder="اكتب اختياراً هنا..." maxlength="50">
            <button id="addBtn">➕ إضافة</button>
            <button id="clearBtn">🗑️ مسح الكل</button>
        </div>

        <ul id="choicesList" class="choices-list">
            <li class="empty-message">لا توجد اختيارات بعد</li>
        </ul>

        <div class="wheel-container">
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
        </div>

        <button id="spinBtn" disabled>🎲 لف العجلة</button>
        <div id="result"></div>
    </div>

    <script>
        (function() {
            // العناصر
            const input = document.getElementById('choiceInput');
            const addBtn = document.getElementById('addBtn');
            const clearBtn = document.getElementById('clearBtn');
            const listEl = document.getElementById('choicesList');
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const spinBtn = document.getElementById('spinBtn');
            const resultDiv = document.getElementById('result');

            // الحالة
            let items = [];
            let currentRotation = 0; // راديان
            let isSpinning = false;
            let animationFrame = null;

            const colors = [
                '#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0', '#9966FF',
                '#FF9F40', '#C9CBCF', '#7BC8A4', '#E67E22', '#2ECC71',
                '#E74C3C', '#9B59B6', '#3498DB', '#1ABC9C', '#F1C40F',
                '#E84393', '#00B894', '#6C5CE7', '#FD79A8', '#00CEC9'
            ];

            // رسم العجلة
            function drawWheel() {
                const w = canvas.width;
                const h = canvas.height;
                const cx = w / 2;
                const cy = h / 2;
                const radius = 170;
                ctx.clearRect(0, 0, w, h);

                if (items.length === 0) {
                    // رسم دائرة فارغة
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.font = '16px "Segoe UI"';
                    ctx.fillStyle = '#94a3b8';
                    ctx.textAlign = 'center';
                    ctx.fillText('لا توجد خيارات', cx, cy);
                    drawPointer(cx, cy);
                    return;
                }

                const step = (2 * Math.PI) / items.length;
                const startAngle = -Math.PI / 2; // الأعلى

                // رسم القطاعات مع التدوير
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(currentRotation);

                for (let i = 0; i < items.length; i++) {
                    const angleFrom = startAngle + i * step;
                    const angleTo = angleFrom + step;

                    // اللون
                    ctx.fillStyle = colors[i % colors.length];

                    // رسم القوس
                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, radius, angleFrom, angleTo);
                    ctx.closePath();
                    ctx.fill();

                    // حدود بيضاء خفيفة
                    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                    // النص داخل القطاع
                    ctx.save();
                    const textAngle = angleFrom + step / 2;
                    ctx.rotate(textAngle);
                    ctx.textAlign = 'center';
                    ctx.fillStyle = '#0f172a';
                    ctx.font = 'bold 14px "Segoe UI"';
                    // تقليم النص إذا كان طويلاً
                    let text = items[i];
                    if (text.length > 12) text = text.substring(0, 10) + '..';
                    ctx.fillText(text, radius * 0.65, 5);
                    ctx.restore();
                }
                ctx.restore();

                // رسم دائرة مركزية للتزيين
                ctx.beginPath();
                ctx.arc(cx, cy, 25, 0, 2 * Math.PI);
                ctx.fillStyle = '#0f172a';
                ctx.fill();
                ctx.strokeStyle = '#facc15';
                ctx.lineWidth = 3;
                ctx.stroke();

                drawPointer(cx, cy);
            }

            function drawPointer(cx, cy) {
                // مؤشر علوي ثابت
                const pointerX = cx;
                const pointerY = cy - 175; // أعلى الدائرة
                ctx.beginPath();
                ctx.moveTo(pointerX, pointerY);
                ctx.lineTo(pointerX - 15, pointerY - 25);
                ctx.lineTo(pointerX + 15, pointerY - 25);
                ctx.closePath();
                ctx.fillStyle = '#ef4444';
                ctx.fill();
                ctx.strokeStyle = '#450a0a';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            // تحديث قائمة العرض
            function renderList() {
                listEl.innerHTML = '';
                if (items.length === 0) {
                    listEl.innerHTML = '<li class="empty-message">لا توجد اختيارات بعد</li>';
                    spinBtn.disabled = true;
                } else {
                    spinBtn.disabled = false;
                    items.forEach((item, index) => {
                        const li = document.createElement('li');
                        li.className = 'choice-item';
                        li.innerHTML = `
                            <span class="choice-text">${item}</span>
                            <button class="delete-btn" data-index="${index}">حذف</button>
                        `;
                        listEl.appendChild(li);
                    });

                    // إضافة أحداث الحذف
                    document.querySelectorAll('.delete-btn').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            const idx = parseInt(this.getAttribute('data-index'));
                            removeItem(idx);
                        });
                    });
                }
            }

            function removeItem(index) {
                if (isSpinning) return;
                items.splice(index, 1);
                resetWheel();
                renderList();
                drawWheel();
                resultDiv.textContent = '';
            }

            function clearAll() {
                if (isSpinning) return;
                items = [];
                resetWheel();
                renderList();
                drawWheel();
                resultDiv.textContent = '';
            }

            function addChoice(text) {
                const trimmed = text.trim();
                if (trimmed === '') return;
                if (trimmed.length > 50) {
                    alert('الرجاء إدخال نص أقصر (أقل من 50 حرفاً)');
                    return;
                }
                items.push(trimmed);
                input.value = '';
                resetWheel();
                renderList();
                drawWheel();
                resultDiv.textContent = '';
                input.focus();
            }

            function resetWheel() {
                // إيقاف أي دوران سابق
                stopAnimation();
                currentRotation = 0;
                isSpinning = false;
                spinBtn.disabled = items.length === 0;
            }

            function stopAnimation() {
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
            }

            // تدوير العجلة
            function spin() {
                if (isSpinning || items.length === 0) return;
                isSpinning = true;
                spinBtn.disabled = true;
                resultDiv.textContent = 'جاري الدوران...';

                // زاوية عشوائية بين 5 لفات كاملة و 8 لفات
                const extraSpins = 5 + Math.floor(Math.random() * 4);
                const randomOffset = Math.random() * 2 * Math.PI;
                const targetRotation = currentRotation + extraSpins * 2 * Math.PI + randomOffset;

                const startRotation = currentRotation;
                const duration = 4000; // مللي ثانية
                const startTime = performance.now();

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);

                    // دالة تخفيف (easeOutCubic)
                    const ease = 1 - Math.pow(1 - progress, 3);

                    currentRotation = startRotation + (targetRotation - startRotation) * ease;
                    drawWheel();

                    if (progress < 1) {
                        animationFrame = requestAnimationFrame(animate);
                    } else {
                        // انتهى الدوران
                        currentRotation = targetRotation;
                        drawWheel();
                        announceWinner();
                        isSpinning = false;
                        spinBtn.disabled = false;
                        animationFrame = null;
                    }
                }

                animationFrame = requestAnimationFrame(animate);
            }

            function announceWinner() {
                // حساب القطاع الفائز (المؤشر في الأعلى)
                const pointerAngle = -Math.PI / 2; // الأعلى
                const step = (2 * Math.PI) / items.length;
                const startAngle = -Math.PI / 2;

                // الزاوية المحلية للعجلة التي تقابل المؤشر
                let rawAngle = (pointerAngle - currentRotation) % (2 * Math.PI);
                if (rawAngle < 0) rawAngle += 2 * Math.PI;

                // إزاحة startAngle
                const adjustedAngle = (rawAngle - startAngle + 2 * Math.PI) % (2 * Math.PI);
                const index = Math.floor(adjustedAngle / step) % items.length;

                const winner = items[index];
                resultDiv.textContent = `🎉 النتيجة: ${winner}`;
            }

            // الأحداث
            addBtn.addEventListener('click', () => addChoice(input.value));
            input.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addChoice(input.value);
            });
            clearBtn.addEventListener('click', clearAll);
            spinBtn.addEventListener('click', spin);

            // الرسم الأولي
            drawWheel();
            renderList();

            // إعادة الرسم عند تغيير حجم النافذة (اختياري)
            window.addEventListener('resize', () => {
                // لا حاجة لتغيير الكانفاس لأنه ثابت الحجم 400x400
            });
        })();
    </script>
</body>
</html>
