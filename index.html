<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصفية العقل - منصة VIP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
            color: #eef5ff;
            transition: background 0.5s;
        }

        body.mode-calm {
            background: radial-gradient(circle at 20% 30%, #0f1a2f, #030612);
        }
        body.mode-alert {
            background: radial-gradient(circle at 20% 30%, #2f0f1a, #120306);
        }

        .container {
            width: 100%;
            max-width: 850px;
            background: rgba(18, 25, 45, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 4rem;
            padding: 3rem 2.5rem;
            box-shadow: 0 40px 60px rgba(0,0,0,0.7), inset 0 0 40px rgba(0,160,255,0.1);
        }

        /* شريط العنوان VIP */
        .vip-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .crown-icon {
            font-size: 2.5rem;
            filter: drop-shadow(0 0 15px gold);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #ffd966, #e5a500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
            letter-spacing: 2px;
        }
        .stats {
            display: flex;
            gap: 2rem;
            background: rgba(0,0,0,0.4);
            padding: 0.6rem 2rem;
            border-radius: 3rem;
            font-size: 1.2rem;
        }
        .stat {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .stat .icon {
            font-size: 1.9rem;
        }
        .stat .value {
            font-weight: bold;
            color: #ffcc80;
        }

        .main-title {
            font-size: 4.5rem;
            font-weight: 900;
            text-align: center;
            background: linear-gradient(to right, #d0e4ff, #7ab0ff, #c0dcff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            filter: drop-shadow(0 0 30px #0066ff);
            letter-spacing: 3px;
            line-height: 1.2;
        }

        .subtitle {
            text-align: center;
            font-size: 1.4rem;
            color: #a0bbdf;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            padding-bottom: 1.2rem;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }
        .subtitle .brain-icon {
            font-size: 2.2rem;
            filter: drop-shadow(0 0 10px #4da6ff);
        }

        /* لوحة الصيام */
        .fasting-panel {
            background: rgba(15, 25, 45, 0.7);
            border-radius: 3rem;
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.5rem;
            border: 1px solid rgba(100,180,255,0.3);
        }
        .fasting-timer-box {
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .fasting-icon {
            font-size: 2.8rem;
            filter: drop-shadow(0 0 12px #00a6ff);
        }
        .timer {
            font-size: 2.3rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            background: #0a1428;
            padding: 0.2rem 1.8rem;
            border-radius: 2.5rem;
            color: #8cd4ff;
            letter-spacing: 3px;
        }
        .btn {
            padding: 0.9rem 2rem;
            border-radius: 3rem;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            border: none;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            box-shadow: 0 8px 18px rgba(0,0,0,0.5);
            color: white;
        }
        .btn-fasting {
            background: #1b3150;
        }
        .btn-fasting.active {
            background: #1f6d4a;
            box-shadow: 0 0 25px #1f6d4a88;
        }
        .btn-icon {
            font-size: 1.7rem;
        }

        /* الشبكة */
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        @media (max-width: 700px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .main-title {
                font-size: 3rem;
            }
        }

        .card {
            background: rgba(18, 26, 44, 0.7);
            border-radius: 2.5rem;
            padding: 1.8rem;
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            font-weight: 700;
        }
        .card-header .icon-lg {
            font-size: 2.8rem;
            filter: drop-shadow(0 0 12px currentColor);
        }

        /* المحظورات */
        .harmful-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.7rem;
            margin-bottom: 1.5rem;
            max-height: 200px;
            overflow-y: auto;
        }
        .tag {
            background: #2a1a28;
            border: 1px solid #b94a6c;
            border-radius: 3rem;
            padding: 0.5rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.95rem;
            color: #f7c4c4;
        }
        .tag .icon-small {
            font-size: 1.3rem;
        }
        .tag button {
            background: none;
            border: none;
            color: #ee9999;
            font-size: 1.3rem;
            cursor: pointer;
            line-height: 1;
        }
        .tag button:hover {
            color: white;
            transform: scale(1.3);
        }

        .cat-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: #1e2537;
            border: 1px solid #3a4b6a;
            color: #ccd;
            padding: 0.4rem 1.1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .cat-btn.active {
            background: #3a2a52;
            border-color: #b47cff;
            color: white;
        }

        .add-row {
            display: flex;
            gap: 0.5rem;
        }
        .add-row input {
            flex: 1;
            background: #1b2337;
            border: 1px solid #3d4f6e;
            padding: 0.7rem 1.2rem;
            border-radius: 2.5rem;
            color: white;
            outline: none;
        }
        .btn-add {
            background: #661122;
        }

        /* فحص */
        .search-row {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .search-row input {
            flex: 1;
            background: #1b2337;
            border: 1px solid #3d4f6e;
            padding: 0.8rem 1.2rem;
            border-radius: 2.5rem;
            color: white;
            outline: none;
        }
        .btn-check {
            background: #0055cc;
            box-shadow: 0 8px 18px rgba(0,68,170,0.5);
        }
        .btn-check:hover {
            background: #0066ee;
        }
        .live-warning {
            font-size: 0.9rem;
            color: #ffaa88;
            min-height: 1.4rem;
            margin-bottom: 0.5rem;
        }
        .result-box {
            padding: 1rem;
            border-radius: 2rem;
            font-weight: bold;
            text-align: center;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }
    </style>
</head>
<body class="mode-calm">
    <div class="container">
        <!-- شريط VIP -->
        <div class="vip-bar">
            <div class="crown-icon">
                <span>👑</span> منصة العقل VIP
            </div>
            <div class="stats">
                <div class="stat">
                    <span class="icon">🚫</span>
                    <span>محظور:</span>
                    <span class="value" id="blockedCount">0</span>
                </div>
                <div class="stat">
                    <span class="icon">✅</span>
                    <span>فحص:</span>
                    <span class="value" id="checksCount">0</span>
                </div>
            </div>
        </div>

        <!-- العنوان الرئيسي -->
        <h1 class="main-title">تصفية العقل</h1>
        <div class="subtitle">
            <span class="brain-icon">🧠</span> عقلك منصة خاصة .. لا يدخلها ما يضر
        </div>

        <!-- الصيام -->
        <div class="fasting-panel">
            <div class="fasting-timer-box">
                <span class="fasting-icon">⏳</span>
                <span class="timer" id="fastingTimer">00:00:00</span>
            </div>
            <button class="btn btn-fasting" id="toggleFastingBtn">
                <span class="btn-icon">▶</span> بدء الصيام
            </button>
        </div>

        <!-- المحتوى الأساسي -->
        <div class="grid-2">
            <!-- المحظورات -->
            <div class="card">
                <div class="card-header" style="color: #ffb3b3;">
                    <span class="icon-lg">⛔</span> قائمة الحظر
                </div>
                <div class="cat-row" id="categoryFilters">
                    <button class="cat-btn active" data-cat="all">الكل</button>
                    <button class="cat-btn" data-cat="مشاعر">😡 مشاعر</button>
                    <button class="cat-btn" data-cat="عادات">📱 عادات</button>
                    <button class="cat-btn" data-cat="أفكار">💭 أفكار</button>
                </div>
                <div class="harmful-tags" id="harmfulTagsContainer"></div>
                <div class="add-row">
                    <input type="text" id="newHarmfulInput" placeholder="أضف محظوراً جديداً...">
                    <button class="btn btn-add" id="addHarmfulBtn"><span>➕</span> إضافة</button>
                </div>
            </div>

            <!-- فحص المؤثرات -->
            <div class="card">
                <div class="card-header" style="color: #b3ffcc;">
                    <span class="icon-lg">🔍</span> فحص المؤثرات
                </div>
                <div class="search-row">
                    <input type="text" id="checkInput" placeholder="اكتب فكرة أو مؤثر للفحص...">
                    <button class="btn btn-check" id="checkBtn"><span>✅</span> تحقق</button>
                </div>
                <div class="live-warning" id="liveWarning"></div>
                <div id="resultDisplay" class="result-box"></div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // قائمة افتراضية مع تصنيفات
            const defaultItems = [
                { text: "الغضب", cat: "مشاعر" },
                { text: "الحسد", cat: "مشاعر" },
                { text: "التفكير السلبي", cat: "أفكار" },
                { text: "وسائل التواصل المفرطة", cat: "عادات" },
                { text: "الأخبار السيئة", cat: "عادات" },
                { text: "مقارنة النفس", cat: "أفكار" },
                { text: "الخوف من الفشل", cat: "مشاعر" },
                { text: "القلق الزائد", cat: "مشاعر" },
                { text: "التشاؤم", cat: "أفكار" },
                { text: "النميمة", cat: "عادات" },
                { text: "الإدمان الرقمي", cat: "عادات" },
                { text: "العلاقات السامة", cat: "عادات" }
            ];

            let harmfulList = [];
            const STORAGE_KEY = 'mindVipHarmfulListV2';
            let fastingActive = false;
            let fastingSeconds = 0;
            let fastingInterval = null;
            let fastingStartTime = null;
            let totalChecks = 0;
            let currentCategory = 'all';

            // عناصر DOM
            const harmfulContainer = document.getElementById('harmfulTagsContainer');
            const blockedCountEl = document.getElementById('blockedCount');
            const checksCountEl = document.getElementById('checksCount');
            const newInput = document.getElementById('newHarmfulInput');
            const addBtn = document.getElementById('addHarmfulBtn');
            const checkInput = document.getElementById('checkInput');
            const checkBtn = document.getElementById('checkBtn');
            const resultDisplay = document.getElementById('resultDisplay');
            const liveWarning = document.getElementById('liveWarning');
            const timerEl = document.getElementById('fastingTimer');
            const fastingBtn = document.getElementById('toggleFastingBtn');
            const catButtons = document.querySelectorAll('.cat-btn');
            const body = document.body;

            // تحميل البيانات
            function loadData() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try { harmfulList = JSON.parse(stored); if (!Array.isArray(harmfulList)) harmfulList = [...defaultItems]; }
                    catch { harmfulList = [...defaultItems]; }
                } else {
                    harmfulList = [...defaultItems];
                }
                // حالة الصيام
                const savedFasting = localStorage.getItem('mindVipFasting');
                if (savedFasting === 'active') {
                    const start = localStorage.getItem('mindVipFastingStart');
                    if (start) {
                        fastingStartTime = parseInt(start, 10);
                        fastingActive = true;
                        fastingSeconds = Math.floor((Date.now() - fastingStartTime) / 1000);
                        startTimer();
                    }
                }
                totalChecks = parseInt(localStorage.getItem('mindVipTotalChecks') || '0', 10);
                updateStats();
            }

            function saveList() { localStorage.setItem(STORAGE_KEY, JSON.stringify(harmfulList)); updateStats(); }
            function updateStats() {
                if (blockedCountEl) blockedCountEl.textContent = harmfulList.length;
                if (checksCountEl) checksCountEl.textContent = totalChecks;
            }

            function getFiltered() {
                return currentCategory === 'all' ? harmfulList : harmfulList.filter(i => i.cat === currentCategory);
            }

            function renderTags() {
                if (!harmfulContainer) return;
                const items = getFiltered();
                harmfulContainer.innerHTML = '';
                if (items.length === 0) {
                    harmfulContainer.innerHTML = '<div style="color:#888; padding:0.5rem;">لا توجد محظورات</div>';
                    return;
                }
                items.forEach((item) => {
                    const idx = harmfulList.indexOf(item);
                    const tag = document.createElement('span');
                    tag.className = 'tag';
                    tag.innerHTML = `<span class="icon-small">🚫</span> ${escapeHTML(item.text)} <button data-idx="${idx}">✕</button>`;
                    harmfulContainer.appendChild(tag);
                });
                // ربط أزرار الحذف
                document.querySelectorAll('.tag button').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        const index = parseInt(this.dataset.idx, 10);
                        if (!isNaN(index) && index >= 0 && index < harmfulList.length) {
                            harmfulList.splice(index, 1);
                            saveList();
                            renderTags();
                            clearResult();
                        }
                    });
                });
            }

            function escapeHTML(str) {
                return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            }

            // إضافة عنصر
            function addItem() {
                const text = newInput.value.trim();
                if (!text) return;
                if (harmfulList.some(item => item.text === text)) {
                    alert('هذا العنصر موجود بالفعل.');
                    return;
                }
                let cat = 'عادات';
                if (text.includes('غضب') || text.includes('خوف') || text.includes('قلق') || text.includes('حسد')) cat = 'مشاعر';
                else if (text.includes('تفكير') || text.includes('تشاؤم') || text.includes('سلبية')) cat = 'أفكار';
                harmfulList.push({ text, cat });
                saveList();
                renderTags();
                newInput.value = '';
            }
            addBtn?.addEventListener('click', addItem);
            newInput?.addEventListener('keypress', e => { if (e.key === 'Enter') addItem(); });

            // فحص النص
            function checkText() {
                const thought = checkInput.value.trim();
                if (!thought) {
                    resultDisplay.innerHTML = '⚠️ الرجاء إدخال نص للفحص';
                    return;
                }
                totalChecks++;
                localStorage.setItem('mindVipTotalChecks', totalChecks);
                updateStats();

                const found = harmfulList.some(item => thought.includes(item.text) || item.text.includes(thought));
                if (found) {
                    resultDisplay.innerHTML = `🚫 "${escapeHTML(thought)}" ممنوع من دخول العقل`;
                    body.className = 'mode-alert';
                    setTimeout(() => { body.className = 'mode-calm'; }, 800);
                } else {
                    resultDisplay.innerHTML = `✅ "${escapeHTML(thought)}" مسموح .. مرحباً به`;
                    body.className = 'mode-calm';
                }
            }
            function clearResult() { if (resultDisplay) resultDisplay.innerHTML = ''; }

            checkInput?.addEventListener('input', function() {
                const val = this.value.trim();
                if (val && harmfulList.some(item => val.includes(item.text))) {
                    liveWarning.textContent = '⚠️ هذا النص يحتوي على عنصر محظور!';
                } else {
                    liveWarning.textContent = '';
                }
            });
            checkBtn?.addEventListener('click', checkText);
            checkInput?.addEventListener('keypress', e => { if (e.key === 'Enter') checkText(); });

            // التصنيفات
            catButtons.forEach(btn => {
                btn.addEventListener('click', function() {
                    catButtons.forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderTags();
                });
            });

            // مؤقت الصيام
            function formatTime(sec) {
                const h = Math.floor(sec / 3600);
                const m = Math.floor((sec % 3600) / 60);
                const s = sec % 60;
                return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }
            function updateTimerDisplay() { if (timerEl) timerEl.textContent = formatTime(fastingSeconds); }
            function startTimer() {
                if (fastingInterval) clearInterval(fastingInterval);
                fastingInterval = setInterval(() => {
                    if (fastingActive) { fastingSeconds++; updateTimerDisplay(); }
                }, 1000);
            }
            function updateFastingButton() {
                if (!fastingBtn) return;
                fastingBtn.innerHTML = fastingActive ? '<span class="btn-icon">⏸️</span> إيقاف الصيام' : '<span class="btn-icon">▶</span> بدء الصيام';
                fastingBtn.classList.toggle('active', fastingActive);
            }
            function toggleFasting() {
                fastingActive = !fastingActive;
                if (fastingActive) {
                    fastingStartTime = Date.now();
                    localStorage.setItem('mindVipFasting', 'active');
                    localStorage.setItem('mindVipFastingStart', fastingStartTime);
                    startTimer();
                } else {
                    localStorage.setItem('mindVipFasting', 'inactive');
                    localStorage.removeItem('mindVipFastingStart');
                    if (fastingInterval) { clearInterval(fastingInterval); fastingInterval = null; }
                }
                updateFastingButton();
                updateTimerDisplay();
            }
            fastingBtn?.addEventListener('click', toggleFasting);

            // بدء التطبيق
            loadData();
            renderTags();
            updateTimerDisplay();
            if (fastingActive) startTimer();
            updateFastingButton();
        })();
    </script>
</body>
</html>
