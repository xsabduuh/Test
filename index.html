<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>DevPath 180 • Notes Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <style>
    :root {
      --bg: #0a0a0f;
      --card: #16162a;
      --border: #2a2a40;
      --text: #ecedf0;
      --secondary: #8b8b96;
      --accent: #3b82f6;
      --accent2: #2563eb;
      --green: #10b981;
      --red: #ef4444;
      --radius: 14px;
      --font: -apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif;
      --mono: 'SF Mono', 'JetBrains Mono', 'Fira Code', monospace;
      --shadow: 0 8px 30px rgba(0,0,0,0.6);
      --note-bg: #1c1c30;
      --project-bg: #24243a;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html { height: 100%; overflow: hidden; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      height: 100%;
      display: flex;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .app { flex: 1; display: flex; flex-direction: column; min-height: 100dvh; }
    ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

    /* ---- HOME VIEW ---- */
    .home-view, .trash-view { display: none; flex-direction: column; flex: 1; padding: 16px 16px 0; }
    .home-view.active, .trash-view.active { display: flex; }
    .home-header, .trash-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; gap: 8px; }
    .home-title, .trash-title {
      font-size: 2rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--accent), var(--green));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .home-actions { display: flex; gap: 12px; }
    .home-new-btn, .home-project-btn {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--card); color: var(--accent); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease;
    }
    .home-new-btn:hover, .home-project-btn:hover { background: #2a2a44; border-color: var(--accent); transform: scale(1.05); }
    .home-project-btn { color: var(--green); border-color: rgba(16,185,129,0.25); }
    .home-project-btn:hover { border-color: var(--green); background: rgba(16,185,129,0.08); }

    .home-tools { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .search-input {
      flex: 1; min-width: 180px;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 10px 16px; border-radius: 12px;
      font-size: 0.9rem; outline: none;
    }
    .search-input::placeholder { color: var(--secondary); }
    .filter-chip {
      padding: 8px 16px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--secondary); cursor: pointer; font-size: 0.8rem;
      font-weight: 600; white-space: nowrap; transition: all 0.2s;
    }
    .filter-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .section-title {
      font-size: 0.8rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 1px; color: var(--secondary);
      margin-bottom: 10px; padding-left: 6px;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .note-card-home {
      background: var(--note-bg); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px;
      cursor: pointer; transition: all 0.2s; position: relative;
    }
    .note-card-home:hover { border-color: var(--accent); box-shadow: 0 6px 16px rgba(59,130,246,0.12); }
    .note-card-home:active { background: #262640; }
    .note-card-home .title { font-weight: 600; font-size: 0.95rem; margin-bottom: 8px; padding-right: 24px; }
    .note-card-home .lang {
      font-size: 0.65rem; text-transform: uppercase;
      color: rgba(59,130,246,0.7);
      background: rgba(59,130,246,0.08);
      padding: 2px 8px; border-radius: 6px;
    }
    .note-card-home .project-badge {
      font-size: 0.65rem; text-transform: uppercase;
      color: rgba(16,185,129,0.7);
      background: rgba(16,185,129,0.08);
      padding: 2px 8px; border-radius: 6px;
    }
    .pin-btn {
      position: absolute; top: 10px; right: 10px;
      background: none; border: none; color: var(--secondary);
      cursor: pointer; padding: 4px; border-radius: 4px;
      transition: color 0.2s, background 0.2s;
    }
    .pin-btn.pinned { color: #f59e0b; }
    .pin-btn:hover { background: rgba(255,255,255,0.06); }
    .delete-btn {
      position: absolute; bottom: 12px; right: 12px;
      background: none; border: none; color: var(--secondary);
      cursor: pointer; font-size: 0.75rem; transition: color 0.2s;
    }
    .delete-btn:hover { color: var(--red); }

    .empty-notes { grid-column: 1 / -1; text-align: center; padding: 30px 20px; color: var(--secondary); font-size: 0.85rem; }
    .bottom-links { display: flex; gap: 16px; margin-top: 10px; align-items: center; }
    .dashboard-link, .trash-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--accent); text-decoration: none; font-weight: 500;
      font-size: 0.85rem; cursor: pointer;
    }
    .trash-link { color: var(--secondary); }
    .trash-link:hover { color: var(--text); }

    /* ---- EDITOR VIEW ---- */
    .editor-view { display: none; flex-direction: column; flex: 1; }
    .editor-view.active { display: flex; }
    .navbar { padding: 8px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--border); min-height: 52px; background: #0d0d18; }
    .back-btn { background: none; border: none; color: var(--accent); font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .nav-title-input { flex: 1; background: transparent; border: none; font-size: 1.15rem; font-weight: 600; color: var(--text); outline: none; }
    .nav-title-input::placeholder { color: var(--secondary); }

    /* Professional tab bar with file type indicators */
    .tabs-bar {
      display: flex; align-items: stretch; gap: 0;
      background: #0c0c1a; border-bottom: 1px solid #252540;
      padding: 0 8px; overflow-x: auto; min-height: 38px;
    }
    .tab {
      display: flex; align-items: center; gap: 8px;
      padding: 0 14px; height: 38px;
      font-size: 0.8rem; font-weight: 500;
      color: var(--secondary);
      background: transparent;
      border: 1px solid transparent;
      border-bottom: 2px solid transparent;
      cursor: pointer; white-space: nowrap;
      transition: all 0.15s ease;
      margin-right: 2px;
    }
    .tab:hover { color: #d0d0e0; background: rgba(255,255,255,0.03); border-bottom-color: rgba(255,255,255,0.1); }
    .tab.active { color: #fff; background: #1a1a32; border-bottom: 2px solid var(--accent); font-weight: 600; }
    .file-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #555;
    }
    .file-dot.html { background: #e44d26; }
    .file-dot.css { background: #264de4; }
    .file-dot.js, .file-dot.jsx, .file-dot.ts { background: #f7df1e; }
    .file-dot.py { background: #306998; }
    .file-dot.json { background: #f5a623; }
    .file-dot.md, .file-dot.txt { background: #6c757d; }
    .tab-close {
      width: 18px; height: 18px; border-radius: 4px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; color: inherit; opacity: 0;
      transition: opacity 0.15s, background 0.15s; line-height: 1; margin-left: 2px;
    }
    .tab:hover .tab-close { opacity: 0.6; }
    .tab .tab-close:hover { opacity: 1; background: rgba(255,255,255,0.12); }
    .add-file-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 0 14px; height: 38px;
      background: transparent; border: none;
      color: var(--secondary); font-size: 0.8rem; font-weight: 500;
      cursor: pointer; white-space: nowrap; transition: all 0.2s;
      margin-left: auto;
    }
    .add-file-btn:hover { color: #fff; background: rgba(255,255,255,0.04); }

    .editor-container { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .code-stage { flex: 1; position: relative; overflow: hidden; }
    .code-layer {
      position: absolute; inset: 12px 12px 12px 50px;
      font-family: var(--mono); font-size: 0.88rem;
      line-height: 1.75; white-space: pre-wrap;
      overflow: auto; border: none; outline: none; background: transparent;
    }
    .code-textarea { color: transparent; caret-color: var(--accent); resize: none; z-index: 2; }
    .code-textarea::selection { background: rgba(59,130,246,0.35); }
    .code-preview { pointer-events: none; z-index: 1; }
    .code-preview code { background: transparent !important; padding: 0 !important; }
    .line-numbers {
      position: absolute; top: 12px; left: 4px; bottom: 12px;
      width: 40px; font-family: var(--mono); font-size: 0.78rem;
      color: var(--secondary); text-align: right;
      overflow: hidden; z-index: 3; pointer-events: none;
      line-height: 1.75; padding-right: 6px;
    }
    .line-numbers span { display: block; }
    .preview-pane { display: none; position: absolute; inset: 0; background: #fff; z-index: 10; }
    .preview-pane.visible { display: flex; }
    .preview-pane iframe { width: 100%; height: 100%; border: none; }

    .bottom-toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-top: 1px solid var(--border);
      background: #0a0a14; flex-wrap: wrap;
    }
    .lang-picker {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); padding: 7px 14px; border-radius: 20px;
      font-size: 0.8rem; outline: none; cursor: pointer;
    }
    .tool-btn {
      padding: 8px 14px; border-radius: 20px;
      border: 1px solid var(--border); background: var(--card);
      color: var(--text); font-size: 0.8rem; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
      transition: all 0.15s;
    }
    .tool-btn:active { transform: scale(0.95); }
    .tool-btn.copy { color: var(--green); border-color: rgba(16,185,129,0.3); }
    .tool-btn.copy.copied { background: rgba(16,185,129,0.2); border-color: var(--green); }
    .tool-btn.save { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tool-btn.delete { color: var(--red); border-color: rgba(239,68,68,0.3); }
    .tool-btn svg { width: 16px; height: 16px; }
    .tool-btn.undo, .tool-btn.redo { color: var(--secondary); }
    .tool-btn.undo:disabled, .tool-btn.redo:disabled { opacity: 0.4; pointer-events: none; }
    .tool-btn.preview { color: var(--accent); font-weight: 600; }
    .tool-btn.select-all { color: var(--secondary); }
    .status-bar {
      padding: 4px 18px; display: flex; justify-content: space-between;
      font-size: 0.7rem; color: var(--secondary); font-family: var(--mono);
      background: #0a0a14;
    }

    .toast-panel {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 200; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
    }
    .toast {
      background: var(--card); border: 1px solid var(--border);
      padding: 10px 22px; border-radius: 20px;
      font-weight: 500; font-size: 0.85rem;
      box-shadow: var(--shadow); text-align: center;
      animation: toastIn 0.4s ease; pointer-events: auto;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }

    @media (max-width: 480px) { .notes-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="app" id="appRoot">

  <!-- HOME VIEW -->
  <div class="home-view active" id="homeView">
    <div class="home-header">
      <span class="home-title">DevPath Notes</span>
      <div class="home-actions">
        <button class="home-new-btn" id="homeNewBtn" title="New note">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/>
          </svg>
        </button>
        <button class="home-project-btn" id="homeProjectBtn" title="New project">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/>
          </svg>
        </button>
      </div>
    </div>
    <div class="home-tools">
      <input type="text" class="search-input" id="homeSearch" placeholder="Search notes..." autocomplete="off">
      <button class="filter-chip active" data-lang="all">All</button>
      <button class="filter-chip" data-lang="html">HTML</button>
      <button class="filter-chip" data-lang="css">CSS</button>
      <button class="filter-chip" data-lang="javascript">JS</button>
      <button class="filter-chip" data-lang="python">Python</button>
    </div>
    <div class="section-title">Notes</div>
    <div class="notes-grid" id="notesGrid"></div>
    <div class="section-title">Projects</div>
    <div class="notes-grid" id="projectsGrid"></div>
    <div class="bottom-links">
      <a href="./index.html" class="dashboard-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Dashboard
      </a>
      <span class="trash-link" id="trashLink">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
        Trash
      </span>
    </div>
  </div>

  <!-- TRASH VIEW -->
  <div class="trash-view" id="trashView">
    <div class="trash-header">
      <span class="trash-title">Trash</span>
      <button class="back-btn" id="trashBackBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
    </div>
    <div class="notes-grid" id="trashGrid"></div>
    <div class="empty-notes" id="trashEmpty" style="display:none;">Trash is empty.</div>
  </div>

  <!-- EDITOR VIEW -->
  <div class="editor-view" id="editorView">
    <div class="navbar">
      <button class="back-btn" id="editorBackBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        Back
      </button>
      <input type="text" class="nav-title-input" id="noteTitle" placeholder="Note title">
    </div>
    <div class="tabs-bar" id="tabsBar" style="display:none;">
      <span id="tabsContainer" style="display:flex; align-items:stretch; flex:1;"></span>
      <button class="add-file-btn" id="addFileBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add file
      </button>
    </div>
    <div class="editor-container">
      <div class="code-stage" id="codeStage">
        <div class="line-numbers" id="lineNums">1</div>
        <textarea class="code-layer code-textarea" id="codeTextarea" placeholder="Write code…" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        <pre class="code-layer code-preview"><code class="hljs" id="codeHighlight"></code></pre>
        <div class="preview-pane" id="previewPane">
          <iframe id="previewIframe" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>
    </div>
    <div class="bottom-toolbar">
      <select class="lang-picker" id="langPicker">
        <option value="html">HTML</option>
        <option value="css">CSS</option>
        <option value="javascript">JavaScript</option>
        <option value="jsx">React JSX</option>
        <option value="typescript">TypeScript</option>
        <option value="python">Python</option>
        <option value="sql">SQL</option>
        <option value="json">JSON</option>
        <option value="bash">Bash</option>
        <option value="plaintext">Plain Text</option>
      </select>
      <button class="tool-btn copy" id="copyBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copy
      </button>
      <button class="tool-btn select-all" id="selectAllBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 4v16"/><path d="M16 4v16"/></svg>
        Select All
      </button>
      <button class="tool-btn undo" id="undoBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"/><path d="M3.51 15.05a9 9 0 102.83-9.11L1 10"/>
        </svg>
      </button>
      <button class="tool-btn redo" id="redoBtn" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><path d="M20.49 15.05a9 9 0 11-2.83-9.11L23 10"/>
        </svg>
      </button>
      <button class="tool-btn preview" id="previewBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        Preview
      </button>
      <button class="tool-btn delete" id="deleteBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
      </button>
      <button class="tool-btn save" id="saveBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
        Save
      </button>
    </div>
    <div class="status-bar">
      <span id="lineCount">Ln 1</span>
      <span id="charCount">0 chars</span>
    </div>
  </div>
</div>

<div class="toast-panel" id="toastPanel"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
(function() {
  const STORAGE_KEY = 'devpath_notes';
  const TRASH_KEY = 'devpath_trash';
  const TRASH_DAYS = 30;

  let notes = [];
  let trash = [];
  let currentId = null;
  let originalNote = null;
  let filterLang = 'all';
  let searchTerm = '';

  let currentFiles = null;
  let activeFileName = 'index.html';
  let isMultiFile = false;

  let undoStack = [];
  let redoStack = [];
  let currentSnapshot = '';
  let isUndoRedo = false;
  let previewVisible = false;
  let updatePreviewTimer;

  const $ = id => document.getElementById(id);
  const homeView = $('homeView');
  const trashView = $('trashView');
  const editorView = $('editorView');
  const previewPane = $('previewPane');
  const previewIframe = $('previewIframe');
  const codeTextarea = $('codeTextarea');
  const codeHighlight = $('codeHighlight');
  const lineNums = $('lineNums');
  const notesGrid = $('notesGrid');
  const projectsGrid = $('projectsGrid');
  const trashGrid = $('trashGrid');
  const trashEmpty = $('trashEmpty');
  const tabsBar = $('tabsBar');
  const tabsContainer = $('tabsContainer');

  function toast(msg) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    $('toastPanel').appendChild(t); setTimeout(() => t.remove(), 2500);
  }

  // ── STORAGE ──
  function loadNotesFromStorage() {
    try { notes = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch (e) { notes = []; }
    notes.forEach(n => { if (!n.id) n.id = generateId(); if (!n.updated) n.updated = Date.now(); if (n.pinned === undefined) n.pinned = false; });
  }
  function saveNotesToStorage() { localStorage.setItem(STORAGE_KEY, JSON.stringify(notes)); }

  function loadTrashFromStorage() {
    try { trash = JSON.parse(localStorage.getItem(TRASH_KEY)) || []; }
    catch (e) { trash = []; }
    const now = Date.now();
    const cutoff = now - TRASH_DAYS * 24 * 60 * 60 * 1000;
    trash = trash.filter(item => item.deletedAt > cutoff);
    saveTrashToStorage();
  }
  function saveTrashToStorage() { localStorage.setItem(TRASH_KEY, JSON.stringify(trash)); }

  function generateId() { return Date.now().toString(36) + Math.random().toString(36).substr(2,9); }

  // ── HOME RENDERING ──
  function renderHome() {
    const noteList = notes.filter(n => !n.files);
    const projectList = notes.filter(n => !!n.files);
    const applyFilters = (list) => {
      let filtered = [...list];
      if (filterLang !== 'all') filtered = filtered.filter(n => n.lang === filterLang);
      if (searchTerm.trim()) {
        const q = searchTerm.toLowerCase();
        filtered = filtered.filter(n => (n.title||'').toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q));
      }
      // Sort pinned first, then updated desc
      filtered.sort((a,b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.updated - a.updated);
      return filtered;
    };
    renderGrid(notesGrid, applyFilters(noteList), false);
    renderGrid(projectsGrid, applyFilters(projectList), true);
  }

  function renderGrid(grid, items, isProject) {
    if (!items.length) { grid.innerHTML = `<div class="empty-notes">No ${isProject?'projects':'notes'} yet.</div>`; return; }
    grid.innerHTML = items.map(n => {
      const isPinned = n.pinned ? 'pinned' : '';
      const langLabel = isProject ? '<span class="project-badge">Project</span>' : `<span class="lang">${n.lang||'txt'}</span>`;
      return `
      <div class="note-card-home" data-id="${n.id}">
        <button class="pin-btn ${isPinned}" data-pin="${n.id}" title="${n.pinned ? 'Unpin' : 'Pin'}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="${n.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l3 9h6l-3 9v4H6v-4l-3-9h6z"/></svg>
        </button>
        <div class="title">${esc(n.title || 'Untitled')}</div>
        ${langLabel}
        <button class="delete-btn" data-del="${n.id}">Delete</button>
      </div>`;
    }).join('');
    grid.querySelectorAll('.note-card-home').forEach(card => {
      card.addEventListener('click', e => {
        if (e.target.closest('[data-del]') || e.target.closest('[data-pin]')) return;
        openNote(card.dataset.id);
      });
    });
    grid.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = btn.dataset.del;
        moveToTrash(id);
      });
    });
    grid.querySelectorAll('[data-pin]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const id = btn.dataset.pin;
        togglePin(id);
      });
    });
  }

  function togglePin(id) {
    const note = notes.find(n => n.id === id);
    if (note) {
      note.pinned = !note.pinned;
      note.updated = Date.now();
      saveNotesToStorage();
      renderHome();
      toast(note.pinned ? 'Pinned' : 'Unpinned');
    }
  }

  function moveToTrash(id) {
    const note = notes.find(n => n.id === id);
    if (!note) return;
    if (currentId === id) {
      // If currently open, close editor first
      discardChangesAndClose();
    }
    trash.push({ id: generateId(), note: { ...note }, deletedAt: Date.now() });
    notes = notes.filter(n => n.id !== id);
    saveNotesToStorage();
    saveTrashToStorage();
    renderHome();
    toast('Moved to trash');
  }

  // ── TRASH VIEW ──
  function renderTrash() {
    if (!trash.length) {
      trashGrid.innerHTML = '';
      trashEmpty.style.display = 'block';
      return;
    }
    trashEmpty.style.display = 'none';
    trash.sort((a,b) => b.deletedAt - a.deletedAt);
    trashGrid.innerHTML = trash.map(item => {
      const n = item.note;
      return `
      <div class="note-card-home" style="opacity:0.85">
        <div class="title">${esc(n.title || 'Untitled')}</div>
        <div style="font-size:0.65rem; color:var(--secondary); margin-top:4px;">Deleted ${timeAgo(item.deletedAt)}</div>
        <button class="delete-btn" style="position:static; margin-top:8px;" data-restore="${item.id}">Restore</button>
        <button class="delete-btn" style="position:static; margin-left:8px; color:var(--red);" data-permadelete="${item.id}">Delete forever</button>
      </div>`;
    }).join('');
    trashGrid.querySelectorAll('[data-restore]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const trashId = btn.dataset.restore;
        restoreFromTrash(trashId);
      });
    });
    trashGrid.querySelectorAll('[data-permadelete]').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const trashId = btn.dataset.permadelete;
        permanentlyDelete(trashId);
      });
    });
  }

  function restoreFromTrash(trashId) {
    const idx = trash.findIndex(t => t.id === trashId);
    if (idx === -1) return;
    const restoredNote = { ...trash[idx].note, id: trash[idx].note.id || generateId() };
    notes.unshift(restoredNote);
    trash.splice(idx, 1);
    saveNotesToStorage();
    saveTrashToStorage();
    renderTrash();
    renderHome();
    toast('Restored');
  }

  function permanentlyDelete(trashId) {
    if (!confirm('Delete permanently?')) return;
    trash = trash.filter(t => t.id !== trashId);
    saveTrashToStorage();
    renderTrash();
    toast('Permanently deleted');
  }

  function timeAgo(timestamp) {
    const seconds = Math.floor((Date.now() - timestamp) / 1000);
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    return `${days}d ago`;
  }

  function showTrash() {
    homeView.classList.remove('active');
    trashView.classList.add('active');
    renderTrash();
  }
  function hideTrash() {
    trashView.classList.remove('active');
    homeView.classList.add('active');
    renderHome();
  }

  // ── OPEN / CLOSE NOTES ──
  function openNote(id) {
    if (previewVisible) togglePreview();
    const note = notes.find(n => n.id === id); if (!note) return;
    currentId = id; originalNote = JSON.parse(JSON.stringify(note));
    $('noteTitle').value = note.title || '';
    isMultiFile = !!note.files;
    if (isMultiFile) {
      currentFiles = { ...note.files };
      activeFileName = Object.keys(currentFiles)[0] || 'index.html';
      tabsBar.style.display = 'flex'; renderTabs();
    } else {
      currentFiles = null; tabsBar.style.display = 'none';
      codeTextarea.value = note.content || ''; $('langPicker').value = note.lang || 'plaintext';
    }
    homeView.classList.remove('active');
    editorView.classList.add('active');
    updateEditorContent(); refreshHighlight(); updateStats(); resetUndoRedo();
    // Do NOT focus to avoid keyboard popping up immediately
  }

  function createNewNote(isProject = false) {
    const newNote = { id: generateId(), title: '', updated: Date.now(), lang: 'html', pinned: false };
    if (isProject) newNote.files = { 'index.html': '', 'style.css': '', 'script.js': '' };
    else newNote.content = '';
    notes.unshift(newNote); openNote(newNote.id); renderHome();
  }
  function openNewNote() { createNewNote(false); }
  function openNewProject() { createNewNote(true); }

  function updateEditorContent() {
    if (isMultiFile && currentFiles && activeFileName) {
      codeTextarea.value = currentFiles[activeFileName] || '';
      $('langPicker').value = getLangFromName(activeFileName);
    }
  }
  function getLangFromName(name) {
    const ext = name.split('.').pop().toLowerCase();
    return { html:'html', css:'css', js:'javascript', jsx:'jsx', ts:'typescript', py:'python', sql:'sql', json:'json', sh:'bash' }[ext] || 'plaintext';
  }

  function renderTabs() {
    if (!isMultiFile || !currentFiles) return;
    tabsContainer.innerHTML = Object.keys(currentFiles).map(name => {
      const dotClass = getFileDotClass(name);
      return `
      <div class="tab ${name === activeFileName ? 'active' : ''}" data-file="${name}">
        <span class="file-dot ${dotClass}"></span>
        <span>${name}</span>
        <span class="tab-close" data-close="${name}">&times;</span>
      </div>`;
    }).join('');
    tabsContainer.querySelectorAll('.tab-close').forEach(closeBtn => {
      closeBtn.addEventListener('click', e => {
        e.stopPropagation();
        const fname = closeBtn.dataset.close;
        if (confirm(`Delete ${fname}?`)) {
          delete currentFiles[fname];
          if (activeFileName === fname) activeFileName = Object.keys(currentFiles)[0] || 'index.html';
          renderTabs(); updateEditorContent(); refreshHighlight(); updateStats(); pushToUndo();
        }
      });
    });
    tabsContainer.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', e => {
        if (e.target.classList.contains('tab-close')) return;
        activeFileName = tab.dataset.file;
        renderTabs(); updateEditorContent(); refreshHighlight(); updateStats(); resetUndoRedo();
      });
    });
  }
  function getFileDotClass(name) {
    const ext = name.split('.').pop().toLowerCase();
    return { html: 'html', css: 'css', js: 'js', jsx: 'js', ts: 'js', py: 'py', json: 'json' }[ext] || 'txt';
  }

  function buildCurrentNoteFromUI() {
    const idx = notes.findIndex(n => n.id === currentId); if (idx === -1) return null;
    const note = { ...notes[idx] };
    note.title = $('noteTitle').value.trim(); note.updated = Date.now();
    if (isMultiFile) { note.files = { ...currentFiles }; delete note.content; }
    else { note.content = codeTextarea.value; note.lang = $('langPicker').value; }
    return note;
  }

  function saveCurrent() {
    if (!currentId) return;
    const updatedNote = buildCurrentNoteFromUI(); if (!updatedNote) return;
    const idx = notes.findIndex(n => n.id === currentId);
    if (idx !== -1) notes[idx] = updatedNote;
    saveNotesToStorage();
    originalNote = JSON.parse(JSON.stringify(updatedNote));
    toast('Saved'); renderHome();
  }

  function discardChangesAndClose() {
    if (!currentId) return;
    const idx = notes.findIndex(n => n.id === currentId);
    const isNewUnsaved = originalNote && !originalNote.title &&
      (!originalNote.files ? !originalNote.content : Object.values(originalNote.files).every(v => !v));
    if (isNewUnsaved && idx !== -1) notes.splice(idx, 1);
    else if (originalNote && idx !== -1) { notes[idx] = { ...originalNote }; saveNotesToStorage(); }
    currentId = null; originalNote = null; isMultiFile = false; currentFiles = null;
    editorView.classList.remove('active'); homeView.classList.add('active');
    $('noteTitle').value = ''; codeTextarea.value = ''; codeHighlight.textContent = '';
    resetUndoRedo(); if (previewVisible) togglePreview(); tabsBar.style.display = 'none';
    renderHome();
  }

  function closeEditor() { discardChangesAndClose(); }

  function deleteCurrent() {
    if (!currentId) return;
    if (!confirm('Delete permanently?')) return;
    moveToTrash(currentId);
    currentId = null;
    editorView.classList.remove('active'); homeView.classList.add('active');
    $('noteTitle').value = ''; codeTextarea.value = ''; codeHighlight.textContent = '';
    resetUndoRedo(); if (previewVisible) togglePreview(); tabsBar.style.display = 'none';
  }

  // ── PREVIEW ──
  function togglePreview() {
    previewVisible = !previewVisible;
    if (previewVisible) {
      codeTextarea.style.display = 'none'; codeHighlight.parentElement.style.display = 'none';
      lineNums.style.display = 'none'; previewPane.classList.add('visible'); updatePreview();
    } else {
      codeTextarea.style.display = ''; codeHighlight.parentElement.style.display = '';
      lineNums.style.display = ''; previewPane.classList.remove('visible');
    }
  }

  function updatePreview() {
    clearTimeout(updatePreviewTimer);
    updatePreviewTimer = setTimeout(() => {
      if (!previewVisible) return;
      let content = '';
      if (isMultiFile && currentFiles) {
        const html = currentFiles['index.html'] || currentFiles[Object.keys(currentFiles).find(f=>f.endsWith('.html'))] || '';
        const css = Object.keys(currentFiles).filter(f=>f.endsWith('.css')).map(f=>currentFiles[f]).join('\n');
        const js = Object.keys(currentFiles).filter(f=>f.endsWith('.js')).map(f=>currentFiles[f]).join('\n');
        if (html) {
          content = html.replace('</head>', `<style>${css}</style></head>`).replace('</body>', `<script>${js}<\/script></body>`);
          if (!/<head/i.test(html)) content = `<style>${css}</style>${html}<script>${js}<\/script>`;
        }
      } else { content = codeTextarea.value; }
      previewIframe.srcdoc = content;
    }, 80);
  }

  // ── UNDO / REDO ──
  function resetUndoRedo() { undoStack=[]; redoStack=[]; currentSnapshot=codeTextarea.value; updateUndoButtons(); }
  function updateUndoButtons() { $('undoBtn').disabled=undoStack.length===0; $('redoBtn').disabled=redoStack.length===0; }
  function pushToUndo() { const val=codeTextarea.value; if(val!==currentSnapshot&&!isUndoRedo){undoStack.push(currentSnapshot);currentSnapshot=val;redoStack=[];updateUndoButtons();} }
  function performUndo() { if(!undoStack.length)return; isUndoRedo=true; const prev=undoStack.pop(); redoStack.push(currentSnapshot); codeTextarea.value=prev; currentSnapshot=prev; refreshHighlight();updateStats();if(previewVisible)updatePreview(); if(isMultiFile&&activeFileName)currentFiles[activeFileName]=prev; updateUndoButtons(); isUndoRedo=false; }
  function performRedo() { if(!redoStack.length)return; isUndoRedo=true; const nxt=redoStack.pop(); undoStack.push(currentSnapshot); codeTextarea.value=nxt; currentSnapshot=nxt; refreshHighlight();updateStats();if(previewVisible)updatePreview(); if(isMultiFile&&activeFileName)currentFiles[activeFileName]=nxt; updateUndoButtons(); isUndoRedo=false; }

  function refreshHighlight() { const code=codeTextarea.value, lang=$('langPicker').value; let out; try{out=lang==='plaintext'?esc(code):hljs.highlight(code,{language:lang,ignoreIllegals:true}).value;}catch(e){out=esc(code);} codeHighlight.innerHTML=out;syncScroll();drawLineNumbers(); }
  function syncScroll(){ const pre=codeHighlight.parentElement; pre.scrollTop=codeTextarea.scrollTop; pre.scrollLeft=codeTextarea.scrollLeft; }
  function drawLineNumbers(){ const lines=codeTextarea.value.split('\n'); lineNums.innerHTML=lines.map((_,i)=>`<span>${i+1}</span>`).join(''); lineNums.scrollTop=codeTextarea.scrollTop; }
  async function copyCode(){ const code=codeTextarea.value; if(!code.trim()){toast('Nothing to copy');return;} try{await navigator.clipboard.writeText(code);const btn=$('copyBtn');btn.classList.add('copied');btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg> Copied!';setTimeout(()=>{btn.classList.remove('copied');btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy';},2000);toast('Copied');}catch(e){toast('Copy failed');}}
  function selectAllCode(){ codeTextarea.focus(); codeTextarea.select(); toast('All code selected (Ctrl+C to copy)'); }
  function updateStats(){ const code=codeTextarea.value; $('charCount').textContent=code.length+' chars'; $('lineCount').textContent='Ln '+code.split('\n').length; }
  function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  // ── INIT ──
  loadNotesFromStorage();
  loadTrashFromStorage();
  renderHome();

  // ── EVENT LISTENERS ──
  $('homeNewBtn').addEventListener('click', openNewNote);
  $('homeProjectBtn').addEventListener('click', openNewProject);
  $('editorBackBtn').addEventListener('click', closeEditor);
  $('saveBtn').addEventListener('click', saveCurrent);
  $('deleteBtn').addEventListener('click', deleteCurrent);
  $('copyBtn').addEventListener('click', copyCode);
  $('selectAllBtn').addEventListener('click', selectAllCode);
  $('undoBtn').addEventListener('click', performUndo);
  $('redoBtn').addEventListener('click', performRedo);
  $('previewBtn').addEventListener('click', togglePreview);
  $('homeSearch').addEventListener('input', e => { searchTerm = e.target.value; renderHome(); });
  document.querySelectorAll('.filter-chip').forEach(chip => chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active'); filterLang = chip.dataset.lang; renderHome();
  }));
  $('langPicker').addEventListener('change', () => refreshHighlight());
  codeTextarea.addEventListener('input', () => { refreshHighlight(); updateStats(); pushToUndo(); if(isMultiFile&&activeFileName) currentFiles[activeFileName]=codeTextarea.value; if(previewVisible) updatePreview(); });
  codeTextarea.addEventListener('scroll', () => { syncScroll(); drawLineNumbers(); });
  codeTextarea.addEventListener('keydown', e => {
    if(e.key==='Tab'){ e.preventDefault(); const s=codeTextarea.selectionStart; codeTextarea.value=codeTextarea.value.substring(0,s)+'  '+codeTextarea.value.substring(codeTextarea.selectionEnd); codeTextarea.selectionStart=codeTextarea.selectionEnd=s+2; refreshHighlight();updateStats();pushToUndo(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='z'){ e.preventDefault(); performUndo(); }
    if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.key==='Z'&&e.shiftKey))){ e.preventDefault(); performRedo(); }
  });
  document.addEventListener('keydown', e => {
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); saveCurrent(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='n'){ e.preventDefault(); openNewNote(); }
  });
  $('addFileBtn').addEventListener('click', () => {
    let name = prompt('File name (e.g., main.js):'); if (!name) return;
    if (!/\.\w+$/.test(name)) name += '.html';
    if (currentFiles && currentFiles[name]) return toast('File already exists');
    if (currentFiles) currentFiles[name] = '';
    activeFileName = name;
    renderTabs(); updateEditorContent(); refreshHighlight(); updateStats(); resetUndoRedo();
  });
  $('trashLink').addEventListener('click', showTrash);
  $('trashBackBtn').addEventListener('click', hideTrash);

  // Also allow tapping the code area to focus (user action, keyboard will appear)
  codeTextarea.addEventListener('focus', () => {}); // fine
})();
</script>
</body>
</html>
