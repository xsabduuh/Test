<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>عجلة الاختيار العشوائي</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(ellipse at center, #1a1a2e 0%, #0f0f1a 100%);
            height: 100dvh;
            overflow: hidden;  /* يمنع التمرير */
            display: flex;
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
            direction: rtl;
            touch-action: manipulation; /* يمنع التكبير العرضي */
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100%;
            max-height: 100%;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 15px 15px 10px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .app-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #f1f5f9;
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 0;
        }
        .app-title i {
            color: #fbbf24;
            font-size: 1.6rem;
            filter: drop-shadow(0 0 6px rgba(251, 191, 36, 0.5));
        }

        .input-group {
            display: flex;
            gap: 6px;
            width: 100%;
            flex-shrink: 0;
        }
        #choiceInput {
            flex: 1 1 auto;
            padding: 10px 14px;
            border-radius: 50px;
            border: 1px solid #6366f1;
            background: #111827;
            color: #f8fafc;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        #choiceInput:focus {
            border-color: #a5b4fc;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            color: white;
            background: #4f46e5;
            box-shadow: 0 4px 10px rgba(79, 70, 229, 0.4);
            white-space: nowrap;
        }
        .btn:hover {
            background: #6366f1;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            background: #4b5563;
            box-shadow: none;
        }
        .btn-outline {
            background: transparent;
            border: 1px solid #ef4444;
            color: #ef4444;
            box-shadow: none;
        }
        .btn-outline:hover {
            background: #ef4444;
            color: white;
        }

        .choices-scroll {
            list-style: none;
            width: 100%;
            max-height: 90px;  /* قائمة صغيرة قابلة للتمرير داخلياً */
            overflow-y: auto;
            padding: 0;
            background: #0b1120;
            border-radius: 16px;
            border: 1px solid #2d3748;
            flex-shrink: 0;
        }
        .choice-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 14px;
            border-bottom: 1px solid #1e293b;
        }
        .choice-item:last-child {
            border-bottom: none;
        }
        .choice-text {
            flex: 1;
            text-align: right;
            margin-left: 10px;
            word-break: break-word;
            font-size: 0.9rem;
        }
        .icon-btn {
            background: none;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
        }
        .icon-btn:hover {
            color: #fca5a5;
        }

        .wheel-wrapper {
            width: 240px;
            height: 240px;
            flex-shrink: 0;
            margin: 5px 0;
        }
        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.7));
        }

        #spinBtn {
            width: 85%;
            font-size: 1.1rem;
            padding: 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #0f172a;
            box-shadow: 0 5px 12px rgba(245, 158, 11, 0.4);
            border: none;
            flex-shrink: 0;
        }
        #spinBtn:hover:not(:disabled) {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
        }

        .result-box {
            font-size: 1.2rem;
            font-weight: 700;
            color: #facc15;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 6px 20px;
            margin-top: 0;
            flex-shrink: 0;
            min-width: 180px;
            text-align: center;
        }

        .choices-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .choices-scroll::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 8px;
        }
        .choices-scroll::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1 class="app-title">
            <i class="fas fa-circle-nodes"></i> عجلة الحظ
        </h1>

        <div class="input-group">
            <input type="text" id="choiceInput" placeholder="أضف اختياراً..." maxlength="40">
            <button class="btn" id="addBtn"><i class="fas fa-plus"></i> إضافة</button>
            <button class="btn btn-outline" id="clearBtn"><i class="fas fa-trash-can"></i> مسح</button>
        </div>

        <ul id="choicesList" class="choices-scroll">
            <li style="padding:15px; color:#64748b; text-align:center;">لا توجد اختيارات</li>
        </ul>

        <div class="wheel-wrapper">
            <canvas id="wheelCanvas" width="400" height="400"></canvas>
        </div>

        <button class="btn" id="spinBtn" disabled>
            <i class="fas fa-dice-d6"></i> لف العجلة
        </button>
        <div class="result-box" id="result"></div>
    </div>

    <script>
        (function() {
            const input = document.getElementById('choiceInput');
            const addBtn = document.getElementById('addBtn');
            const clearBtn = document.getElementById('clearBtn');
            const listEl = document.getElementById('choicesList');
            const canvas = document.getElementById('wheelCanvas');
            const ctx = canvas.getContext('2d');
            const spinBtn = document.getElementById('spinBtn');
            const resultDiv = document.getElementById('result');

            // --- التخزين المحلي ---
            const STORAGE_KEY = 'randomWheelChoices_v2';
            let items = [];

            function loadFromStorage() {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    try {
                        items = JSON.parse(stored);
                        if (!Array.isArray(items)) items = [];
                    } catch (e) {
                        items = [];
                    }
                } else {
                    items = [];
                }
            }

            function saveToStorage() {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            }

            // --- الرسم و الحالة ---
            let currentRotation = 0;
            let isSpinning = false;
            let animationFrame = null;

            const gradientPairs = [
                ['#FF6B6B', '#C92A2A'], ['#4ECDC4', '#0D7377'], ['#FFD93D', '#B7970B'],
                ['#6C5CE7', '#3D2C8D'], ['#A8E6CF', '#2B7A4B'], ['#FF8C42', '#C45A1A'],
                ['#1DD1A1', '#0F9960'], ['#F368E0', '#A01D8A'], ['#54A0FF', '#1E4D8C'],
                ['#FECA57', '#D18D00'], ['#48DBFB', '#088FB1'], ['#FF9FF3', '#C444AA']
            ];

            function drawWheel() {
                const w = canvas.width;
                const h = canvas.height;
                const cx = w / 2;
                const cy = h / 2;
                const radius = 105; // تصغير ليناسب العرض 240px

                ctx.clearRect(0, 0, w, h);

                // حلقة خارجية
                ctx.beginPath();
                ctx.arc(cx, cy, radius + 4, 0, 2 * Math.PI);
                ctx.strokeStyle = '#4b5563';
                ctx.lineWidth = 3;
                ctx.stroke();

                if (items.length === 0) {
                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
                    ctx.fillStyle = '#1e293b';
                    ctx.fill();
                    ctx.strokeStyle = '#475569';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.font = '16px "Segoe UI"';
                    ctx.fillStyle = '#94a3b8';
                    ctx.textAlign = 'center';
                    ctx.fillText('لا توجد خيارات', cx, cy);
                    drawPointer(cx, cy);
                    return;
                }

                const step = (2 * Math.PI) / items.length;
                const startAngle = -Math.PI / 2;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(currentRotation);

                for (let i = 0; i < items.length; i++) {
                    const angleFrom = startAngle + i * step;
                    const angleTo = angleFrom + step;
                    const midAngle = angleFrom + step / 2;

                    const [color1, color2] = gradientPairs[i % gradientPairs.length];
                    const grad = ctx.createLinearGradient(
                        Math.cos(midAngle) * radius * 0.3,
                        Math.sin(midAngle) * radius * 0.3,
                        Math.cos(midAngle) * radius,
                        Math.sin(midAngle) * radius
                    );
                    grad.addColorStop(0, color1);
                    grad.addColorStop(1, color2);

                    ctx.beginPath();
                    ctx.moveTo(0, 0);
                    ctx.arc(0, 0, radius, angleFrom, angleTo);
                    ctx.closePath();
                    ctx.fillStyle = grad;
                    ctx.fill();
                    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
                    ctx.lineWidth = 1.2;
                    ctx.stroke();

                    ctx.save();
                    ctx.rotate(midAngle);
                    ctx.textAlign = 'center';
                    ctx.font = 'bold 11px "Segoe UI"';
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#000000';
                    ctx.shadowBlur = 3;
                    let displayText = items[i];
                    if (displayText.length > 10) displayText = displayText.substring(0, 9) + '..';
                    ctx.fillText(displayText, radius * 0.6, 4);
                    ctx.restore();
                }

                // مركز معدني
                ctx.beginPath();
                ctx.arc(0, 0, 18, 0, 2 * Math.PI);
                const metalGrad = ctx.createRadialGradient(0, 0, 3, 0, 0, 18);
                metalGrad.addColorStop(0, '#d1d5db');
                metalGrad.addColorStop(0.5, '#9ca3af');
                metalGrad.addColorStop(1, '#4b5563');
                ctx.fillStyle = metalGrad;
                ctx.fill();
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();

                drawPointer(cx, cy);
            }

            function drawPointer(cx, cy) {
                const pointerTop = cy - 116; // radius + 1 تقريباً
                ctx.beginPath();
                ctx.moveTo(cx, pointerTop);
                ctx.lineTo(cx - 10, pointerTop - 20);
                ctx.lineTo(cx + 10, pointerTop - 20);
                ctx.closePath();
                const pointerGrad = ctx.createLinearGradient(cx, pointerTop-20, cx, pointerTop);
                pointerGrad.addColorStop(0, '#ef4444');
                pointerGrad.addColorStop(1, '#b91c1c');
                ctx.fillStyle = pointerGrad;
                ctx.fill();
                ctx.strokeStyle = '#450a0a';
                ctx.lineWidth = 1.8;
                ctx.stroke();
            }

            function renderList() {
                listEl.innerHTML = '';
                if (items.length === 0) {
                    listEl.innerHTML = '<li style="padding:15px; color:#64748b; text-align:center;">لا توجد اختيارات</li>';
                    spinBtn.disabled = true;
                } else {
                    spinBtn.disabled = false;
                    items.forEach((item, index) => {
                        const li = document.createElement('li');
                        li.className = 'choice-item';
                        li.innerHTML = `
                            <span class="choice-text">${item}</span>
                            <button class="icon-btn" data-index="${index}" title="حذف"><i class="fas fa-times-circle"></i></button>
                        `;
                        listEl.appendChild(li);
                    });

                    document.querySelectorAll('.icon-btn').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            if (isSpinning) return;
                            const idx = parseInt(this.getAttribute('data-index'));
                            removeItem(idx);
                        });
                    });
                }
            }

            function removeItem(index) {
                if (isSpinning) return;
                items.splice(index, 1);
                resetWheel();
                saveToStorage(); // حفظ بعد الحذف
                renderList();
                drawWheel();
                resultDiv.textContent = '';
            }

            function clearAll() {
                if (isSpinning) return;
                items = [];
                resetWheel();
                saveToStorage(); // حفظ بعد المسح
                renderList();
                drawWheel();
                resultDiv.textContent = '';
            }

            function addChoice(text) {
                const trimmed = text.trim();
                if (!trimmed) return;
                if (trimmed.length > 40) {
                    alert('الرجاء اختيار نص أقصر (40 حرفاً كحد أقصى)');
                    return;
                }
                items.push(trimmed);
                input.value = '';
                resetWheel();
                saveToStorage(); // حفظ بعد الإضافة
                renderList();
                drawWheel();
                resultDiv.textContent = '';
                input.focus();
            }

            function resetWheel() {
                stopAnimation();
                currentRotation = 0;
                isSpinning = false;
                spinBtn.disabled = items.length === 0;
            }

            function stopAnimation() {
                if (animationFrame) {
                    cancelAnimationFrame(animationFrame);
                    animationFrame = null;
                }
            }

            function spin() {
                if (isSpinning || items.length === 0) return;
                isSpinning = true;
                spinBtn.disabled = true;
                resultDiv.textContent = '... جاري الدوران';

                const extraSpins = 5 + Math.floor(Math.random() * 4);
                const randomOffset = Math.random() * 2 * Math.PI;
                const targetRotation = currentRotation + extraSpins * 2 * Math.PI + randomOffset;
                const startRotation = currentRotation;
                const duration = 3500;
                const startTime = performance.now();

                function animate(now) {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const ease = 1 - Math.pow(1 - progress, 3);
                    currentRotation = startRotation + (targetRotation - startRotation) * ease;
                    drawWheel();

                    if (progress < 1) {
                        animationFrame = requestAnimationFrame(animate);
                    } else {
                        currentRotation = targetRotation;
                        drawWheel();
                        announceWinner();
                        isSpinning = false;
                        spinBtn.disabled = false;
                        animationFrame = null;
                    }
                }
                animationFrame = requestAnimationFrame(animate);
            }

            function announceWinner() {
                const pointerAngle = -Math.PI / 2;
                const step = (2 * Math.PI) / items.length;
                const startAngle = -Math.PI / 2;
                let rawAngle = (pointerAngle - currentRotation) % (2 * Math.PI);
                if (rawAngle < 0) rawAngle += 2 * Math.PI;
                const adjustedAngle = (rawAngle - startAngle + 2 * Math.PI) % (2 * Math.PI);
                const index = Math.floor(adjustedAngle / step) % items.length;
                const winner = items[index];
                resultDiv.textContent = `🎉 ${winner}`;

                // احتفالية مصغرة
                confetti({
                    particleCount: 80,
                    spread: 60,
                    origin: { y: 0.65, x: 0.5 },
                    colors: ['#fbbf24', '#f59e0b', '#4f46e5', '#ec4899']
                });
                setTimeout(() => {
                    confetti({
                        particleCount: 40,
                        angle: 55,
                        spread: 45,
                        origin: { x: 0, y: 0.65 }
                    });
                    confetti({
                        particleCount: 40,
                        angle: 125,
                        spread: 45,
                        origin: { x: 1, y: 0.65 }
                    });
                }, 150);
            }

            // --- التهيئة ---
            function init() {
                loadFromStorage();
                renderList();
                drawWheel();
                // روابط الأحداث
                addBtn.addEventListener('click', () => addChoice(input.value));
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') addChoice(input.value);
                });
                clearBtn.addEventListener('click', clearAll);
                spinBtn.addEventListener('click', spin);
            }

            init();
        })();
    </script>
</body>
</html>
